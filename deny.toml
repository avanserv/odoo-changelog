# `make deps` and CI run every check below. A license, a source or an advisory ignored here needs
# the argument for it written beside it.

[advisories]
# Unmaintained crates are reported for the whole graph, not only for direct dependencies.
unmaintained = "all"
yanked = "deny"

# Permissive licenses, plus MPL-2.0 (file-level copyleft: it binds changes to uluru's own files,
# not this binary). A dependency under anything else fails until it is argued for here.
[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CC0-1.0",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# gix pulls several hashbrown versions; duplicates are worth seeing, not failing on.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
