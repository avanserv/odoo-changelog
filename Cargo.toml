[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
# Released as binaries on GitHub, not on crates.io.
publish = false

[workspace.dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
encoding_rs = "0.8"
gix = { version = "0.89", default-features = false, features = ["sha1", "revision", "max-performance-safe", "blob-diff", "index", "parallel"] }
# Pinned: its parse, error texts included, is extractor output, so a bump goes with a
# `Data::version()` bump.
quick-xml = "=0.42.0"
rayon = "1"
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
# Pinned: their parse trees are extractor output, so a bump goes with a `version()` bump of every
# extractor built on them (`python`, `manifest`).
tree-sitter = "=0.27.1"
tree-sitter-python = "=0.25.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

odoo-changelog-core = { path = "crates/core" }
odoo-changelog-extract = { path = "crates/extract" }
odoo-changelog-git = { path = "crates/git" }
odoo-changelog-store = { path = "crates/store" }

[profile.release]
lto = "thin"
codegen-units = 4
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
